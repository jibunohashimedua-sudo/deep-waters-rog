<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Deep Waters">
  <!-- Square. Every platform masks an app icon itself, so a pre-rounded
       source gets rounded twice and the corners go soft and uneven. The
       ground is the app's own dark ground; the bars keep their radius
       because that radius is the mark. -->
  <rect x="0" y="0" width="100" height="100" fill="#0C0A18"/>
  <g fill="#E9E6F2">
    <rect x="18" y="24" width="64" height="11" rx="5.5"/>
    <rect x="26" y="42" width="48" height="11" rx="5.5"/>
    <rect x="34" y="60" width="32" height="11" rx="5.5"/>
    <rect x="42" y="78" width="16" height="11" rx="5.5"/>
  </g>
</svg>
